name: Run Tests

# Tests run on every pull request and on every push to staging or main, so a failing change
# is caught before it merges. Only a push to main deploys.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    # A throwaway Postgres for this run only, so CI catches what SQLite hides locally.
    # Same major version as Neon; it disappears when the job ends.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # Caches dependencies to speed up subsequent runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Deploy to Render
        # Only a passing push to main deploys; staging and pull requests stop after the tests
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

